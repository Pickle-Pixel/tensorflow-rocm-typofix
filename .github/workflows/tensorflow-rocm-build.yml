name: Build TensorFlow ROCm

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Add Deadsnakes PPA and Install Python 3.10
      - name: Install Python 3.10
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          python3 --version

      # Step 3: Install Bazel and TensorFlow Build Dependencies
      - name: Install Dependencies
        run: |
          sudo apt install -y apt-transport-https curl gnupg
          curl -fsSL https://bazel.build/bazel-release.pub.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/bazel-keyring.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/bazel-keyring.gpg] https://storage.googleapis.com/bazel-apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list > /dev/null
          sudo apt update
          sudo apt install -y bazel openjdk-11-jdk zlib1g-dev libssl-dev swig libopenblas-dev

      # Step 4: Configure TensorFlow Build
      - name: Configure Build
        run: |
          ./configure

      # Step 5: Build TensorFlow Pip Package
      - name: Build TensorFlow Pip Package
        run: |
          bazel build //tensorflow/tools/pip_package:build_pip_package
          mkdir -p /tmp/tensorflow_pkg
          ./bazel-bin/tensorflow/tools/pip_package/build_pip_package /tmp/tensorflow_pkg

      # Step 6: Upload the Built Wheel File as an Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tensorflow-whl
          path: /tmp/tensorflow_pkg/tensorflow-*.whl
