name: Build TensorFlow ROCm

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev python3-pip build-essential openjdk-11-jdk \
              git zlib1g-dev libcurl4-openssl-dev libssl-dev swig libopenblas-dev
          # Add Bazel repository
          sudo apt install -y apt-transport-https curl gnupg
          curl -fsSL https://bazel.build/bazel-release.pub.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/bazel-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/bazel-archive-keyring.gpg] https://bazel.build/apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list
          sudo apt update
          sudo apt install -y bazel
      
      - name: Setup Python Environment
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy wheel

      - name: Configure Build
        run: |
          ./configure
          echo "Configuration complete."

      - name: Build TensorFlow Pip Package
        run: |
          bazel build //tensorflow/tools/pip_package:build_pip_package
          mkdir -p /tmp/tensorflow_pkg
          ./bazel-bin/tensorflow/tools/pip_package/build_pip_package /tmp/tensorflow_pkg

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tensorflow-whl
          path: /tmp/tensorflow_pkg/tensorflow-*.whl
